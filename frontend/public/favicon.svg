<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Shakambari AI Logo Mark: Goddess of Greens & Vegetables Thali + Sprouting Leaves -->
  <!-- Rounded-square tile rx ~ 22% with warm cream background -->
  <rect width="100" height="100" rx="22" fill="#FBF7EE" stroke="#E4E0D2" stroke-width="1.5"/>

  <!-- Outer shadow & steel thali rim -->
  <ellipse cx="50" cy="64" rx="36" ry="17" fill="#14532D" opacity="0.12"/>
  <ellipse cx="50" cy="62" rx="36" ry="16" fill="#F1EFEA" stroke="#14532D" stroke-width="3"/>
  <ellipse cx="50" cy="61" rx="30" ry="12.5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>

  <!-- Food Katoris / bowls inside thali -->
  <circle cx="35" cy="60" r="4.5" fill="#F59E0B"/>
  <circle cx="65" cy="60" r="4.5" fill="#166534"/>
  <circle cx="50" cy="65" r="3.5" fill="#C2410C"/>

  <!-- Sprouting central stem -->
  <path d="M 50 58 C 50 49, 50 40, 50 32" stroke="#14532D" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Left sprouting leaf (sacred basil / vegetable shoot) -->
  <path d="M 50 38 C 41 37, 33 32, 33 21 C 43 22, 48 30, 50 38 Z" fill="#14532D"/>

  <!-- Right sprouting leaf -->
  <path d="M 50 34 C 58 32, 67 26, 66 15 C 57 17, 52 26, 50 34 Z" fill="#166534"/>

  <!-- Golden turmeric seed / bud -->
  <circle cx="50" cy="30" r="2.5" fill="#F59E0B"/>

  <!-- Gentle aromatic steam wisps -->
  <path d="M 41 21 C 39 16, 43 13, 41 8" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 59 18 C 62 13, 58 10, 61 6" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>