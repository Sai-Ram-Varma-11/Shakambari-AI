# Shakambari AI: Local PostgreSQL + API
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: shakambari, POSTGRES_PASSWORD: shakambari, POSTGRES_DB: shakambari }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://shakambari:shakambari@db:5432/shakambari
      SECRET_KEY: local-dev-secret-change-me-0123456789-shakambari
      CORS_ORIGINS: http://localhost:5173
      APP_ENV: development
      TRUST_PROXY: "true"
    ports: ["8000:8000"]
    depends_on: [db]

  test-db:
    image: postgres:16
    profiles: ["test"]
    environment: { POSTGRES_USER: shakambari, POSTGRES_PASSWORD: shakambari, POSTGRES_DB: shakambari_test }
    ports: ["5433:5432"]

volumes: { pgdata: {} }
